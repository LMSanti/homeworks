<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles de la Tarea</title>
</head>
<body>
<h1>Detalles de la Tarea</h1>
<p><strong>ID:</strong> <span th:text="${homework.id}"></span></p>
<p><strong>Título:</strong> <span th:text="${homework.title}"></span></p>
<p><strong>Descripción:</strong> <span th:text="${homework.description}"></span></p>
<p><strong>Fecha de Creación:</strong> <span th:text="${homework.dateCreation}"></span></p>
<p><strong>Hora de Creación:</strong> <span th:text="${homework.timeCreation}"></span></p>
<p><strong>Estado:</strong> <span th:text="${homework.status}"></span></p>
<a href="/homework/list">Volver a la lista</a>
</body>
</html>
